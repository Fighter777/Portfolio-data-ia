<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Architecture du benchmark de modèles de langage locaux">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#f6f8fa"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#24292f">Benchmark reproductible de LLM locaux</text>

  <rect x="45" y="115" width="190" height="120" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#312e81">Prompts fixes</text>
  <text x="140" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#3730a3">code · debug · synthèse</text>
  <text x="140" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#3730a3">formats · contexte long</text>

  <rect x="280" y="115" width="190" height="120" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="375" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">llama-server</text>
  <text x="375" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1d4ed8">API locale</text>
  <text x="375" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1d4ed8">compatible outils dev</text>

  <rect x="515" y="115" width="190" height="120" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="610" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14532d">Modèle local</text>
  <text x="610" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#166534">configuration testée</text>
  <text x="610" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#166534">quantification · contexte</text>

  <rect x="750" y="115" width="190" height="120" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="845" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7c2d12">Mesures</text>
  <text x="845" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#9a3412">TTFT · tokens/s</text>
  <text x="845" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#9a3412">VRAM/RAM · stabilité</text>

  <rect x="985" y="115" width="170" height="120" rx="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="1070" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#581c87">Comparaison</text>
  <text x="1070" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#6b21a8">qualité · erreurs</text>
  <text x="1070" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#6b21a8">grille commune</text>

  <line x1="235" y1="175" x2="275" y2="175" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="470" y1="175" x2="510" y2="175" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="705" y1="175" x2="745" y2="175" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="940" y1="175" x2="980" y2="175" stroke="#6b7280" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="280" y="285" width="640" height="78" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24292f">Traçabilité de chaque essai</text>
  <text x="600" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#57606a">prompt · version · paramètres · environnement · résultat · décision</text>
